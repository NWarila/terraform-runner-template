name: Repo Hygiene

# Single visible entrypoint for the org-wide repo-hygiene policy. Delegates to
# the org-owned reusable, which evaluates NWarila/.github's repo_hygiene.rego
# (SHA-pinned uses:, exact Terraform/provider pins, pull_request_target safety)
# against this repo's checked-out tree. No local policy file or input-builder is
# mirrored here - the reusable sources both from NWarila/.github at source_ref.

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: repo-hygiene
    permissions:
      contents: read
    uses: NWarila/.github/.github/workflows/reusable-repo-hygiene.yaml@16fc66816dea5a593c0d5fbb0574ce3b54b46991
    with:
      source_ref: 16fc66816dea5a593c0d5fbb0574ce3b54b46991
