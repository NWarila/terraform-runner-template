name: Reusable Template Sync

# Pull-mode synchronization. Each consumer repository calls this workflow on a
# schedule (and on demand). The workflow checks out the consumer, checks out
# nwarila/terraform-template at the requested ref, applies every file listed
# in `sync/synced-files.yaml`, and opens (or refreshes) a single PR in the
# consumer if anything changed.
#
# Authentication:
#   No PAT or app token required. The workflow runs in the consumer's context
#   and uses the consumer's GITHUB_TOKEN to push and open the PR. The caller
#   must grant the job `contents: write` and `pull-requests: write`, and the
#   consumer repository must have "Allow GitHub Actions to create and approve
#   pull requests" enabled (Settings → Actions → General → Workflow
#   permissions).
#
# Caller pattern (in each consumer):
#   name: Template Sync
#   on:
#     schedule: [{cron: "17 6 * * *"}]
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     sync:
#       uses: NWarila/terraform-template/.github/workflows/reusable-template-sync.yaml@<40-char-sha>
#       with:
#         template_ref: <40-char-sha>
#
# Renovate keeps both the `uses:` SHA and the `template_ref` input in lockstep
# so the workflow code and the manifest it reads come from the same revision.

on:
  workflow_call:
    inputs:
      template_ref:
        description: SHA, tag, or branch of NWarila/terraform-template to sync from.
        required: true
        type: string
      pr_branch:
        description: Branch name used for the sync PR. Re-runs refresh this branch in place.
        required: false
        type: string
        default: sync/terraform-template
      pr_label:
        description: Label applied to the sync PR.
        required: false
        type: string
        default: template-sync

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync from terraform-template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out consumer
        # zizmor: ignore[artipacked] — credentials must persist to push back
        # to the consumer repo. This workflow does not upload artifacts so
        # the credential cannot leak via that path.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: consumer
          fetch-depth: 0
          persist-credentials: true

      - name: Check out terraform-template
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NWarila/terraform-template
          ref: ${{ inputs.template_ref }}
          path: template
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --no-cache-dir pyyaml==6.0.3

      - name: Configure git identity
        working-directory: consumer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve default branch
        id: defaults
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          echo "default_branch=${default_branch}" >> "$GITHUB_OUTPUT"

      - name: Apply synced files
        id: apply
        working-directory: consumer
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
          DEFAULT_BRANCH: ${{ steps.defaults.outputs.default_branch }}
          TEMPLATE_REF: ${{ inputs.template_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${PR_BRANCH}" "origin/${DEFAULT_BRANCH}"
          python <<'PY'
          import os, sys, yaml
          from pathlib import Path

          template_root = Path("../template").resolve()
          manifest = template_root / "sync" / "synced-files.yaml"
          spec = yaml.safe_load(manifest.read_text(encoding="utf-8"))

          # Map of substitution value-source names to environment variables.
          # Extend here when new value sources are introduced.
          value_sources = {
              "TEMPLATE_REF": os.environ.get("TEMPLATE_REF", ""),
          }

          def resolve_paths(entry):
              if "path" in entry:
                  return entry["path"], entry["path"]
              if "source" in entry and "target" in entry:
                  return entry["source"], entry["target"]
              raise ValueError(f"sync entry needs `path` or `source`+`target`: {entry!r}")

          def apply_substitutions(content_bytes, substitutions):
              if not substitutions:
                  return content_bytes
              text = content_bytes.decode("utf-8")
              for placeholder, source_name in substitutions.items():
                  if source_name not in value_sources:
                      raise ValueError(
                          f"unknown substitution source {source_name!r}; "
                          f"known: {sorted(value_sources)}"
                      )
                  text = text.replace(placeholder, value_sources[source_name])
              return text.encode("utf-8")

          changed = []
          for entry in spec.get("synced_files", []):
              source_rel, target_rel = resolve_paths(entry)
              mode = entry.get("mode", "replace")
              substitutions = entry.get("substitutions") or {}
              src = template_root / source_rel
              dst = Path(target_rel)
              if not src.exists():
                  sys.stderr.write(f"warn: source missing in template: {source_rel}\n")
                  continue
              if mode == "create-if-missing" and dst.exists():
                  continue
              raw = src.read_bytes()
              new = apply_substitutions(raw, substitutions)
              old = dst.read_bytes() if dst.exists() else None
              if new != old:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(new)
                  changed.append(target_rel)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"changed={'|'.join(changed)}\n")
              fh.write(f"changed_count={len(changed)}\n")
          print(f"applied {len(changed)} change(s): {changed}")
          PY

      - name: Open or refresh sync PR
        if: steps.apply.outputs.changed_count != '0'
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_SHA: ${{ inputs.template_ref }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_LABEL: ${{ inputs.pr_label }}
          DEFAULT_BRANCH: ${{ steps.defaults.outputs.default_branch }}
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "no diff after apply — skipping PR"
            exit 0
          fi
          changed_list="$(printf '%s\n' "${CHANGED}" | tr '|' '\n' | sed 's/^/- /')"
          short_sha="${TEMPLATE_SHA:0:12}"
          body=$(cat <<EOF
          Synced from [\`NWarila/terraform-template@${short_sha}\`](https://github.com/NWarila/terraform-template/commit/${TEMPLATE_SHA}).

          Files updated:
          ${changed_list}

          This PR is automatically refreshed when the template changes. Close it to opt out of this round of sync (it will reopen if the template changes again).

          Do not edit the synced files in this branch — the next sync run will overwrite local edits. Customizations belong in repository-specific files outside the sync manifest.
          EOF
          )
          git commit -m "chore(sync): pull mandatory files from terraform-template@${short_sha}"
          git push --force-with-lease origin "${PR_BRANCH}"
          # Ensure the label exists; creation is idempotent (silent fail if it
          # already exists). Without this gh pr create --label fails on first
          # use in a consumer repo because the label hasn't been seeded.
          gh label create "${PR_LABEL}" \
            --color "0E8A16" \
            --description "Automated sync from NWarila/terraform-template" \
            >/dev/null 2>&1 || true
          existing="$(gh pr list --head "${PR_BRANCH}" --state open --json number -q '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --body "${body}"
            echo "refreshed PR #${existing}"
          else
            gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${PR_BRANCH}" \
              --title "chore(sync): pull mandatory files from terraform-template" \
              --body "${body}" \
              --label "${PR_LABEL}"
            echo "opened sync PR"
          fi

      - name: Close stale sync PR if no diff
        if: steps.apply.outputs.changed_count == '0'
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${PR_BRANCH}" --state open --json number -q '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh pr close "${existing}" --delete-branch --comment "Template sync no longer has pending changes; closing."
            echo "closed stale PR #${existing}"
          else
            echo "no diff and no open PR — nothing to do"
          fi
