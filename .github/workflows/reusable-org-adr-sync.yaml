name: Reusable Org ADR Sync

# Verifies that org-baseline ADRs mirrored under
# `docs/decision-records/org/` in the consuming repo match their upstream
# masters byte-for-byte.
#
# Upstream resolution
# -------------------
# By default the reusable looks at `${{ github.repository_owner }}/.github`
# under the path `docs/decision-records/`. So:
#   - nwarila-platform/anything-tf       -> nwarila-platform/.github
#   - NWarila/anything-tf                -> NWarila/.github
#   - the-hero-wars-guys/anything-tf     -> the-hero-wars-guys/.github
#
# If that upstream repository does not exist (or its decision-records path
# is missing), the workflow logs a warning and exits 0 — no ADR baseline
# to mirror. Use the `upstream_repo` and `upstream_path` inputs to override
# this resolution.
#
# Drift policy
# ------------
# - Local mirror present + matches upstream: pass.
# - Local mirror present + differs from upstream: error.
# - Local mirror missing for an upstream-published ADR: error.
# - Local mirror present without upstream master: warning (the upstream may
#   simply not have published the ADR yet).
#
# Caller pattern (every consumer):
#   name: Org ADR Sync
#   on:
#     pull_request:
#       branches: [main]
#       paths:
#         - 'docs/decision-records/org/**'
#         - '.github/workflows/org-adr-sync.yaml'
#     schedule:
#       - cron: "0 6 * * 1"
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     verify:
#       uses: NWarila/terraform-template/.github/workflows/reusable-org-adr-sync.yaml@<sha>

on:
  workflow_call:
    inputs:
      upstream_repo:
        description: |
          Override upstream repository in `owner/repo` form. Defaults to
          `${{ github.repository_owner }}/.github`. Use this when the org's
          ADR baseline lives somewhere other than the default `.github`
          repository.
        required: false
        type: string
        default: ""
      upstream_path:
        description: |
          Path within the upstream repository where org-baseline ADRs live.
          Defaults to `docs/decision-records`.
        required: false
        type: string
        default: "docs/decision-records"
      local_path:
        description: |
          Path within the consumer where org ADR mirrors live. Defaults to
          `docs/decision-records/org`.
        required: false
        type: string
        default: "docs/decision-records/org"

permissions:
  contents: read

jobs:
  verify:
    name: Verify org ADR mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out consumer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compare mirrored ADRs with upstream masters
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO_INPUT: ${{ inputs.upstream_repo }}
          UPSTREAM_PATH: ${{ inputs.upstream_path }}
          LOCAL_PATH: ${{ inputs.local_path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${UPSTREAM_REPO_INPUT}" ]; then
            upstream_repo="${UPSTREAM_REPO_INPUT}"
          else
            upstream_repo="${GITHUB_REPOSITORY_OWNER}/.github"
          fi
          echo "Upstream: ${upstream_repo}/${UPSTREAM_PATH}"
          echo "Local:    ${LOCAL_PATH}"

          # Probe: does the upstream repo exist?
          if ! gh api "repos/${upstream_repo}" >/dev/null 2>&1; then
            echo "::warning::Upstream repo ${upstream_repo} does not exist or is not visible to this token; nothing to sync."
            exit 0
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          # Probe: does the upstream path exist?
          if ! gh api "repos/${upstream_repo}/contents/${UPSTREAM_PATH}" \
                --jq '.[].name' > "${tmpdir}/upstream-names.txt" 2>/dev/null; then
            echo "::warning::Upstream path ${upstream_repo}/${UPSTREAM_PATH} does not exist; nothing to sync."
            exit 0
          fi

          if [ ! -d "${LOCAL_PATH}" ]; then
            # No local mirror directory. If upstream has ADRs, this is a
            # contract failure: the consumer is supposed to mirror them.
            if [ -s "${tmpdir}/upstream-names.txt" ]; then
              echo "::error::Local mirror directory ${LOCAL_PATH} does not exist but upstream has ADRs to mirror."
              exit 1
            fi
            echo "No local mirror directory and no upstream ADRs; nothing to do."
            exit 0
          fi

          status=0

          # Walk local mirrors, compare each with upstream.
          while IFS= read -r local_file; do
            name="$(basename "${local_file}")"

            if ! grep -qx "${name}" "${tmpdir}/upstream-names.txt"; then
              echo "::warning file=${local_file}::No upstream ADR named ${name} exists yet in ${upstream_repo}; cannot byte-compare this mirror."
              continue
            fi

            gh api "repos/${upstream_repo}/contents/${UPSTREAM_PATH}/${name}" \
              --jq .content | base64 --decode > "${tmpdir}/${name}"

            if ! cmp -s "${local_file}" "${tmpdir}/${name}"; then
              echo "::error file=${local_file}::Org ADR mirror differs from upstream ${name}."
              status=1
            fi
          done < <(find "${LOCAL_PATH}" -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]-*.md' | sort)

          # Walk upstream, ensure every published ADR has a local mirror.
          while IFS= read -r upstream_name; do
            case "${upstream_name}" in
              [0-9][0-9][0-9][0-9]-*.md)
                if [ ! -f "${LOCAL_PATH}/${upstream_name}" ]; then
                  echo "::error file=${LOCAL_PATH}::Missing upstream org ADR mirror ${upstream_name}."
                  status=1
                fi
                ;;
            esac
          done < "${tmpdir}/upstream-names.txt"

          exit "${status}"
