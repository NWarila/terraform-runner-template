name: Reusable Terraform Validation

# Reusable workflow consumed by Terraform-runner repositories derived from
# NWarila/terraform-runner-template. Sets up the pinned Terraform version and
# the helper tools needed by the assembled framework tree, runs validation, and
# enforces the golden template contract.
#
# Supported modes
# ---------------
# - mode: runner (data-only deployer consumers)
#     Checks out the framework the runner consumes at `framework_ref`,
#     overlays the runner's data paths onto the framework, then runs
#     `make ci` in the assembled framework tree. End-to-end coverage:
#     validation gates depend on both repos being internally correct AND
#     correctly composable.
#
# - mode: contract-and-lint
#     Skips `make ci` entirely. Used for transitioning consumers that don't
#     yet have a complete validation surface.
#
# Framework-shaped validation belongs to framework templates, not this runner
# template. This workflow rejects `mode: full` to keep ownership explicit.
#
# Consumers call this with `uses:` pinned to a 40-character commit SHA.

on:
  workflow_call:
    inputs:
      terraform_version:
        description: Exact Terraform version (e.g. "1.15.1").
        required: true
        type: string
      template_ref:
        description: |
          40-character SHA of NWarila/terraform-runner-template to check out for
          contract validation. This is validated at job start; use the same SHA
          the caller pins this workflow to so the validator and the workflow stay
          in lockstep.
        required: true
        type: string
      run_contract_check:
        description: Run the golden template contract validator against the consuming repo.
        required: false
        type: boolean
        default: true
      mode:
        description: |
          Validation depth. Supported values:
            runner            - runners. Checks out `framework_repo` at
                                `framework_ref`, applies `overlay_paths`,
                                then runs `make ci` against the assembled
                                tree.
            contract-and-lint - contract validator + caller workflow check
                                + lints only. Skips `make ci`.
          Default: runner.
        required: false
        type: string
        default: runner
      lint_advisory:
        description: |
          When true, lint jobs (actionlint, shellcheck, yamllint, ruff,
          markdownlint) still run and report findings, but do not fail the
          workflow. Default: false (strict).
        required: false
        type: boolean
        default: false
      run_lint_jobs:
        description: |
          Run the reusable workflow's standalone lint jobs. Template self-PRs
          can set this false because CI already runs the same visible gates.
        required: false
        type: boolean
        default: true
      framework_repo:
        description: |
          (mode: runner) `owner/repo` of the framework being deployed.
          Example: NWarila/terraform-framework-template
        required: false
        type: string
        default: ""
      framework_ref:
        description: |
          (mode: runner) 40-character SHA of the framework to check out.
          Renovate pins this in lockstep with the runner's terraform-deploy
          workflow.
        required: false
        type: string
        default: ""
      overlay_paths:
        description: |
          (mode: runner) Newline-separated `<consumer-src>=><framework-dst>`
          entries describing what to copy from the runner onto the framework
          before validation. The arrow `=>` separates source and destination;
          paths are interpreted relative to each repo's root.

          Example:
            repos/public=>terraform/repos/public
            tests/fixtures/private=>terraform/repos/private

          Directory sources are copied as contents, including dotfiles.
          Trailing slashes are accepted for readability but have no
          separate meaning.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Terraform contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate requested mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            runner|contract-and-lint)
              ;;
            full)
              echo "::error::mode=full is not supported by terraform-runner-template; use the framework template's validation reusable for framework-shaped repos."
              exit 1
              ;;
            *)
              echo "::error::unsupported validation mode '${MODE}' (expected runner or contract-and-lint)"
              exit 1
              ;;
          esac

      - name: Validate template ref
        env:
          TEMPLATE_REF: ${{ inputs.template_ref }}
        run: |
          set -euo pipefail
          if ! [[ "${TEMPLATE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::template_ref must be a 40-character SHA, got '${TEMPLATE_REF}'"
            exit 1
          fi

      - name: Check out consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: consumer
          fetch-depth: 1
          persist-credentials: false

      - name: Check out terraform-runner-template
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NWarila/terraform-runner-template
          ref: ${{ inputs.template_ref }}
          path: template
          fetch-depth: 1
          persist-credentials: false

      - name: Validate runner-mode inputs
        if: ${{ inputs.mode == 'runner' }}
        env:
          FRAMEWORK_REPO: ${{ inputs.framework_repo }}
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
          OVERLAY_PATHS: ${{ inputs.overlay_paths }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${FRAMEWORK_REPO}" ]; then
            echo "::error::mode=runner requires framework_repo input"
            missing=1
          fi
          if [ -z "${FRAMEWORK_REF}" ]; then
            echo "::error::mode=runner requires framework_ref input"
            missing=1
          fi
          if [ -z "${OVERLAY_PATHS}" ]; then
            echo "::error::mode=runner requires overlay_paths input"
            missing=1
          fi
          # Framework ref must be a 40-char SHA — same rule as the contract.
          if [ -n "${FRAMEWORK_REF}" ] && ! [[ "${FRAMEWORK_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::framework_ref must be a 40-character SHA, got '${FRAMEWORK_REF}'"
            missing=1
          fi
          exit "${missing}"

      - name: Check out framework (runner mode)
        if: ${{ inputs.mode == 'runner' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.framework_repo }}
          ref: ${{ inputs.framework_ref }}
          path: framework
          fetch-depth: 1
          persist-credentials: false

      - name: Apply overlay (runner mode)
        if: ${{ inputs.mode == 'runner' }}
        env:
          OVERLAY_PATHS: ${{ inputs.overlay_paths }}
        run: |
          set -euo pipefail
          validate_overlay_path() {
            local kind="$1"
            local value="$2"
            if [ -z "${value}" ]; then
              echo "::error::overlay ${kind} is empty"
              exit 1
            fi
            if [[ "${value}" == /* ]]; then
              echo "::error::overlay ${kind} must be relative: ${value}"
              exit 1
            fi
            if [[ "${value}" == "." || "${value}" == ".." || "${value}" == ../* || "${value}" == */../* || "${value}" == */.. ]]; then
              echo "::error::overlay ${kind} must not contain path traversal: ${value}"
              exit 1
            fi
          }
          allowed_overlay_destination() {
            local value="${1%/}"
            case "${value}" in
              terraform/repos|terraform/repos/*|terraform/fixtures/runtime|terraform/fixtures/runtime/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }
          # Newline-separated entries of the form `src=>dst`. Strip blank
          # lines and comments. Use `cp -a <src>/. <dst>/` so dotfiles are
          # included and trailing-slash directory semantics are explicit.
          while IFS= read -r line; do
            entry="${line%%#*}"
            entry="$(echo "${entry}" | xargs)"
            [ -z "${entry}" ] && continue
            if [[ "${entry}" != *"=>"* ]]; then
              echo "::error::overlay entry missing '=>' separator: ${entry}"
              exit 1
            fi
            src="${entry%%=>*}"
            dst="${entry##*=>}"
            src="$(echo "${src}" | xargs)"
            dst="$(echo "${dst}" | xargs)"
            validate_overlay_path "source" "${src}"
            validate_overlay_path "destination" "${dst}"
            if ! allowed_overlay_destination "${dst}"; then
              echo "::error::overlay destination must be under terraform/repos/ or terraform/fixtures/runtime/: ${dst}"
              exit 1
            fi
            src_path="consumer/${src}"
            dst_path="framework/${dst}"
            if [ ! -e "${src_path}" ]; then
              echo "::error::overlay source missing: ${src_path}"
              exit 1
            fi
            mkdir -p "${dst_path}"
            # Copy contents (the trailing /. handles directories with
            # dotfiles; for files this is also fine because cp falls back
            # to single-file copy when src is a file).
            if [ -d "${src_path}" ]; then
              cp -a "${src_path}/." "${dst_path}/"
            else
              cp -a "${src_path}" "${dst_path}"
            fi
            echo "overlay: ${src_path} -> ${dst_path}"
          done <<< "${OVERLAY_PATHS}"

      - name: Setup Terraform
        if: ${{ inputs.mode == 'runner' }}
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Install pinned CI tools
        if: ${{ inputs.mode == 'runner' }}
        env:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          TFLINT_VERSION: "0.62.0"
          # renovate: datasource=github-releases depName=terraform-docs/terraform-docs
          TERRAFORM_DOCS_VERSION: "0.23.0"
          # renovate: datasource=github-releases depName=open-policy-agent/opa
          OPA_VERSION: "1.10.0"
        run: bash template/tools/install_ci_tools.sh

      - name: Setup Python for contract validator
        if: ${{ inputs.run_contract_check }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        if: ${{ inputs.run_contract_check }}
        run: python -m pip install --no-cache-dir pyyaml==6.0.3

      - name: Verify golden template contract
        if: ${{ inputs.run_contract_check }}
        working-directory: consumer
        run: |
          python ../template/tools/check_template_contract.py \
            --repo-root . \
            --contract ../template/contract/runner-template-contract.yaml \
            --template-root ../template \
            --type runner

      - name: Verify caller workflow conformance
        if: ${{ inputs.run_contract_check }}
        working-directory: consumer
        run: |
          python ../template/tools/check_caller_workflows.py --repo-root .

      - name: Run framework make ci on assembled tree (runner)
        if: ${{ inputs.mode == 'runner' }}
        working-directory: framework
        run: make ci

  actionlint:
    name: actionlint
    if: ${{ inputs.run_lint_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.lint_advisory }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
          reporter: github-check
          # Disable actionlint's embedded shellcheck — we run a dedicated
          # shellcheck job below with --severity=warning, which filters out
          # the style/info noise (e.g., SC2129) that the embedded version
          # surfaces as errors and which has no fail-level filter.
          actionlint_flags: "-shellcheck="

  shellcheck:
    name: shellcheck
    if: ${{ inputs.run_lint_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.lint_advisory }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run shellcheck
        run: find . -type f -name '*.sh' -not -path './.git/*' -exec shellcheck --severity=warning {} +

  yamllint:
    name: yamllint
    if: ${{ inputs.run_lint_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.lint_advisory }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: python -m pip install --no-cache-dir yamllint==1.35.1
      - name: Run yamllint on workflows
        run: |
          yamllint -d "{
            extends: relaxed,
            rules: {
              line-length: disable,
              document-start: disable,
              comments: disable,
              truthy: {check-keys: false}
            }
          }" .github/workflows/

  ruff:
    name: ruff
    if: ${{ inputs.run_lint_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.lint_advisory }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --no-cache-dir ruff==0.13.0
      - name: Run ruff check
        run: |
          if [ -d tools ]; then
            ruff check tools/
          else
            echo "no tools/ directory — skipping"
          fi

  markdownlint:
    name: markdownlint
    if: ${{ inputs.run_lint_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.lint_advisory }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6b51ade7a9e4a75a7ad929842dd298a3804ebe8b # v23.1.0
        with:
          globs: "**/*.md"
