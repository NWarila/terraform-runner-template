name: Release Please

# Opens and publishes releases from Conventional Commits. The reusable
# dispatches release-evidence.yaml when a release is created.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    uses: ./.github/workflows/reusable-release-please.yaml
