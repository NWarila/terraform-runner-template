name: CI

# Self-validation for NWarila/terraform-runner-template. Mirrors the
# terraform-framework-template check surface while preserving runner-specific
# contract and integration coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
          reporter: github-check

  workflow-helper-tests:
    name: workflow helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run workflow helper tests
        run: python tools/verify.py workflow-helper-tests

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6b51ade7a9e4a75a7ad929842dd298a3804ebe8b # v23.1.0
        with:
          globs: "**/*.md"

  mypy-advisory:
    name: mypy (advisory)
    # Type-check `tools/` to surface real regressions in static typing.
    # Advisory only — does not block merges. Use `::warning::` annotations
    # so findings are visible in PR review without failing the job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install --no-cache-dir mypy==1.13.0 types-PyYAML==6.0.12.20240917
      - name: Run mypy (advisory)
        run: |
          python -m mypy --ignore-missing-imports tools/ \
            || echo "::warning::Mypy advisory reported findings (does not block merge)"

  cross-template-drift:
    name: cross-template drift
    # Enforces zero drift between this template's shape-shared regions
    # (validator core + harness skeleton) and the sibling runner template's
    # equivalent regions. Fails the job if a maintainer changed a shape-
    # shared section in this template without changing it in the sibling.
    # See docs/explanation/cross-template-sync.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CROSS_TEMPLATE_SIBLING_REPO: NWarila/packer-runner-template
      CROSS_TEMPLATE_SIBLING_REF: main
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Check cross-template drift
        run: python tools/check_cross_template_drift.py

  ruff-sarif:
    name: ruff (SARIF → Security tab)
    # The existing `terraform runner verify` job runs `ruff check` via
    # verify.py for the lint gate. This job duplicates that run with
    # `--output-format sarif` so findings flow into the consumer's
    # GitHub Security tab alongside CodeQL, Trivy, Gitleaks, zizmor,
    # and Scorecard. continue-on-error keeps Security-tab publishing
    # advisory; the verify.py-based gate above remains the hard block.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # required to check out and lint repository tooling
      security-events: write # required to upload Ruff SARIF to GitHub Security
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install --no-cache-dir ruff==0.13.0
      - name: Run ruff with SARIF output
        continue-on-error: true
        run: ruff check --output-format sarif --output-file ruff.sarif tools/
      - name: Upload ruff SARIF
        if: always() && hashFiles('ruff.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: ruff.sarif

  terraform-runner-verify:
    name: terraform runner verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out runner template
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: terraform-runner-template
          fetch-depth: 1
          persist-credentials: false

      - name: Check out framework template
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NWarila/terraform-framework-template
          # renovate: depName=NWarila/terraform-framework-template packageName=https://github.com/NWarila/terraform-framework-template currentValue=main
          ref: a0e1a519eb3e9229c494e1fbef50934434e5766c
          path: terraform-framework-template
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: "1.15.4"
          terraform_wrapper: false

      - name: Install pinned CI tools
        working-directory: terraform-runner-template
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: "1.7.12"
          # renovate: datasource=npm depName=markdownlint-cli2
          MARKDOWNLINT_CLI2_VERSION: "0.22.1"
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          TFLINT_VERSION: "0.62.0"
          # renovate: datasource=github-releases depName=terraform-docs/terraform-docs
          TERRAFORM_DOCS_VERSION: "0.23.0"
          # renovate: datasource=github-releases depName=open-policy-agent/opa
          OPA_VERSION: "1.10.0"
        run: bash tools/install_ci_tools.sh

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Verify
        working-directory: terraform-runner-template
        run: python tools/verify.py verify
