name: Terraform Deploy

# Golden runner deploy example. Pull requests validate through pr-validation.yaml.
# Trusted main/manual runs assume AWS via OIDC, initialize the framework with an
# S3 backend, apply the saved plan, and verify that the remote state object
# exists and is encrypted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: framework-deploy
    permissions:
      contents: read
      id-token: write
    uses: NWarila/terraform-framework-template/.github/workflows/reusable-terraform-deploy.yaml@24deab9db40fbf22a8e7a0c61d7110098c0a1397
    with:
      # renovate: depName=NWarila/terraform-framework-template packageName=https://github.com/NWarila/terraform-framework-template currentValue=main
      framework_ref: 24deab9db40fbf22a8e7a0c61d7110098c0a1397
      overlay_paths: |
        repos/public => terraform/repos/public
        repos/private => terraform/repos/private
      tfvars_file: repos/public/sample-environments.tfvars
      backend_mode: s3
      backend_key_prefix: nwarila-platform/terraform-runner-template
      upload_plan_artifact: false
      apply: true
    secrets:
      aws_role_arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      aws_region: ${{ secrets.AWS_REGION }}
      backend_bucket: ${{ secrets.TF_BACKEND_BUCKET }}
