name: Terraform Deploy

# Golden runner deploy example. Pull requests validate through pr-validation.yaml.
# Trusted main/manual runs assume AWS via OIDC, initialize the framework with an
# S3 backend, apply the saved plan, and verify that the remote state object
# exists and is encrypted.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: framework-deploy
    permissions:
      contents: read # required by the framework reusable to inspect runner files
      id-token: write # required for AWS OIDC federation during deploy
    uses: NWarila/terraform-framework-template/.github/workflows/reusable-terraform-deploy.yaml@db6b94c6e6f6d8bd77e721bfc48f241e2a60eff3
    with:
      # renovate: depName=NWarila/terraform-framework-template packageName=https://github.com/NWarila/terraform-framework-template currentValue=main
      framework_ref: db6b94c6e6f6d8bd77e721bfc48f241e2a60eff3
      overlay_paths: |
        terraform/public => terraform/repos/public
        terraform/private => terraform/repos/private
      tfvars_file: terraform/public/sample-environments.tfvars
      backend_mode: s3
      backend_key_prefix: nwarila/terraform-runner-template
      upload_plan_artifact: false
      apply: true
    secrets:
      aws_role_arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      aws_region: ${{ secrets.AWS_REGION }}
      backend_bucket: ${{ secrets.TF_BACKEND_BUCKET }}
