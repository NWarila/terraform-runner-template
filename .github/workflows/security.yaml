name: Security Scan

# Calls the local reusable IaC security workflow for the same Trivy,
# Gitleaks, and zizmor coverage expected from downstream runner repos.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-iac-security.yaml
