name: Security

# One visible security entrypoint. The detailed implementations live in the
# SHA-pinned NWarila/.github org reusable workflows (no local copies; the
# contract forbids local reusable-*.yaml and requires the org reusables).

on:
  branch_protection_rule:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iac:
    name: IaC and secret scan
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: NWarila/.github/.github/workflows/reusable-iac-security.yaml@f25a0e36f0591687862ff78f9f7b9d94fe577bc7

  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: NWarila/.github/.github/workflows/reusable-codeql.yaml@f25a0e36f0591687862ff78f9f7b9d94fe577bc7

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    uses: NWarila/.github/.github/workflows/reusable-scorecard.yaml@f25a0e36f0591687862ff78f9f7b9d94fe577bc7
