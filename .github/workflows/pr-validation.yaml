name: PR Validation

# Working reference caller for runner-mode validation. It proves the
# template reusable can check out the framework at a fixed SHA, overlay
# runner-owned data, and run the assembled framework gate.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: runner validation
    uses: NWarila/terraform-runner-template/.github/workflows/reusable-terraform-validation.yaml@c66675fe2d4ddfbd43da308c15ac28ca2272ea6d
    with:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$ versioning=hashicorp
      terraform_version: "1.15.1"
      # renovate: depName=NWarila/terraform-runner-template packageName=https://github.com/NWarila/terraform-runner-template currentValue=main
      template_ref: c66675fe2d4ddfbd43da308c15ac28ca2272ea6d
      mode: runner
      run_contract_check: true
      run_lint_jobs: false
      lint_advisory: false
      framework_repo: NWarila/terraform-framework-template
      # renovate: depName=NWarila/terraform-framework-template packageName=https://github.com/NWarila/terraform-framework-template currentValue=main
      framework_ref: db6b94c6e6f6d8bd77e721bfc48f241e2a60eff3
      overlay_paths: |
        repos/public => terraform/repos/public
        tests/fixtures/repos/private => terraform/repos/private
