name: Canonical Baseline Sync

# Pulls the universal layer (reusable workflows, toolchain configs, shared
# tools) from NWarila/terraform-template-template (canonical) into this
# template at a pinned SHA, opens or refreshes a single PR if anything
# differs. Per-type files (the runner contract, runner reusable-pr-validation
# bits, runner-specific scaffold) are NOT touched — sync only covers the
# universal/terraform-shared baseline as enumerated in
# `sync/canonical-baseline.yaml`.
#
# This is the same pattern the consumer-side reusable-template-sync uses,
# inlined here so the template can stay self-contained and the dependency
# chain is one-way (terraform-template-template -> per-type templates ->
# consumers).

on:
  schedule:
    - cron: "37 6 * * *"  # daily, offset from consumer template-sync's 17 6 * * *
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sync/canonical-baseline.yaml"
      - ".github/workflows/canonical-baseline-sync.yaml"

permissions:
  contents: read

concurrency:
  group: canonical-baseline-sync
  cancel-in-progress: false

env:
  CANONICAL_REPO: NWarila/terraform-template-template
  # Pinned SHA of the canonical commit to sync from. Renovate manages this.
  # renovate: datasource=github-tags depName=NWarila/terraform-template-template
  CANONICAL_REF: 5a9279e0514ab054d89430a4453409213f9f351f
  PR_BRANCH: sync/canonical-baseline
  PR_LABEL: canonical-baseline-sync

jobs:
  sync:
    name: Sync from canonical
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out this template
        # zizmor: ignore[artipacked] — credentials must persist to push back.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: this
          fetch-depth: 0
          persist-credentials: true

      - name: Check out canonical
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.CANONICAL_REPO }}
          ref: ${{ env.CANONICAL_REF }}
          path: canonical
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --no-cache-dir pyyaml==6.0.3

      - name: Configure git identity
        working-directory: this
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve default branch
        id: defaults
        working-directory: this
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          echo "default_branch=${default_branch}" >> "$GITHUB_OUTPUT"

      - name: Apply canonical baseline files
        id: apply
        working-directory: this
        env:
          PR_BRANCH: ${{ env.PR_BRANCH }}
          DEFAULT_BRANCH: ${{ steps.defaults.outputs.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${PR_BRANCH}" "origin/${DEFAULT_BRANCH}"
          python <<'PY'
          import os, sys, yaml
          from pathlib import Path

          canonical_root = Path("../canonical").resolve()
          manifest = Path("sync/canonical-baseline.yaml")
          if not manifest.is_file():
              sys.stderr.write(f"manifest missing at {manifest}\n")
              sys.exit(2)
          spec = yaml.safe_load(manifest.read_text(encoding="utf-8"))
          changed = []
          for entry in spec.get("baseline_files", []):
              if "path" in entry:
                  source_rel = target_rel = entry["path"]
              elif "source" in entry and "target" in entry:
                  source_rel = entry["source"]
                  target_rel = entry["target"]
              else:
                  raise ValueError(f"malformed entry: {entry!r}")
              src = canonical_root / source_rel
              dst = Path(target_rel)
              if not src.exists():
                  sys.stderr.write(f"warn: canonical source missing: {source_rel}\n")
                  continue
              new = src.read_bytes()
              old = dst.read_bytes() if dst.exists() else None
              if new != old:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(new)
                  changed.append(target_rel)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"changed={'|'.join(changed)}\n")
              fh.write(f"changed_count={len(changed)}\n")
          print(f"applied {len(changed)} change(s): {changed}")
          PY

      - name: Open or refresh sync PR
        if: steps.apply.outputs.changed_count != '0'
        working-directory: this
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL_REPO: ${{ env.CANONICAL_REPO }}
          CANONICAL_REF: ${{ env.CANONICAL_REF }}
          PR_BRANCH: ${{ env.PR_BRANCH }}
          PR_LABEL: ${{ env.PR_LABEL }}
          DEFAULT_BRANCH: ${{ steps.defaults.outputs.default_branch }}
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "no diff after apply — skipping PR"
            exit 0
          fi
          changed_list="$(printf '%s\n' "${CHANGED}" | tr '|' '\n' | sed 's/^/- /')"
          short_sha="${CANONICAL_REF:0:12}"
          body=$(cat <<EOF
          Synced from [\`${CANONICAL_REPO}@${short_sha}\`](https://github.com/${CANONICAL_REPO}/commit/${CANONICAL_REF}).

          Files updated:
          ${changed_list}

          This PR is automatically refreshed when the canonical template advances. Close it to opt out of this round of sync (it will reopen if canonical advances again).

          Do not edit the synced files in this branch — the next sync run will overwrite local edits. Per-type customizations belong in files outside the canonical-baseline manifest.
          EOF
          )
          git commit -m "chore(sync): pull canonical baseline from terraform-template-template@${short_sha}"
          git push --force-with-lease origin "${PR_BRANCH}"
          gh label create "${PR_LABEL}" \
            --color "0E8A16" \
            --description "Automated sync from canonical template" \
            >/dev/null 2>&1 || true
          existing="$(gh pr list --head "${PR_BRANCH}" --state open --json number -q '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --body "${body}"
            echo "refreshed PR #${existing}"
          else
            gh pr create \
              --base "${DEFAULT_BRANCH}" \
              --head "${PR_BRANCH}" \
              --title "chore(sync): pull canonical baseline from terraform-template-template" \
              --body "${body}" \
              --label "${PR_LABEL}"
            echo "opened sync PR"
          fi

      - name: Close stale sync PR if no diff
        if: steps.apply.outputs.changed_count == '0'
        working-directory: this
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ env.PR_BRANCH }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${PR_BRANCH}" --state open --json number -q '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh pr close "${existing}" --delete-branch --comment "Canonical baseline sync no longer has pending changes; closing."
            echo "closed stale PR #${existing}"
          else
            echo "no diff and no open PR — nothing to do"
          fi
