name: Self CI

# Self-validation for NWarila/terraform-runner-template. Catches errors in
# the template before they ship to consumer runner repos — typo'd workflow
# YAML, broken contract validator, lint regressions, etc.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
          reporter: github-check

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run shellcheck
        run: shellcheck tools/install_ci_tools.sh

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: python -m pip install --no-cache-dir yamllint==1.35.1
      - name: Run yamllint
        run: |
          yamllint -d "{
            extends: relaxed,
            rules: {
              line-length: disable,
              document-start: disable,
              comments: disable,
              truthy: {check-keys: false}
            }
          }" .github/workflows/ contract/

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --no-cache-dir ruff==0.13.0
      - name: Run ruff check
        run: ruff check tools/

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6b51ade7a9e4a75a7ad929842dd298a3804ebe8b # v23.1.0
        with:
          globs: "**/*.md"

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        # renovate: datasource=pypi depName=zizmor
        run: python -m pip install --no-cache-dir zizmor==1.24.1
      - name: Run zizmor
        run: zizmor --persona regular .github/workflows/

  audit-tools-smoke-test:
    name: audit tools smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --no-cache-dir pyyaml==6.0.3
      - name: check_template_contract.py imports
        run: python tools/check_template_contract.py --help
      - name: Contract YAML is well-formed (runner-only)
        run: |
          python -c "
          import yaml
          with open('contract/runner-template-contract.yaml') as fh:
              spec = yaml.safe_load(fh)
          assert spec['version'] == '2', f'unexpected contract version: {spec.get(\"version\")}'
          assert 'universal' in spec, 'missing universal block'
          assert 'types' in spec, 'missing types block'
          assert 'runner' in spec['types'], 'missing types.runner'
          assert 'framework' not in spec['types'], 'this template enforces only runner; framework type should not be present'
          assert 'workflow_pinning' in spec, 'missing workflow_pinning'
          print('runner-template contract manifest looks well-formed')
          "
      - name: Install drift-gate (manifest schema)
        # renovate: datasource=github-tags depName=NWarila/drift-gate
        run: >-
          python -m pip install --no-cache-dir
          'git+https://github.com/NWarila/drift-gate@d835ae411f1e55e25b2b6c079d5891e7345a043c'
      - name: Template-tier baseline-manifest.json is well-formed
        # Validates that this template's own template-tier manifest parses
        # against drift-gate's stdlib schema and that every `source` resolves
        # on disk. Catches a broken template manifest here, before downstream
        # consumers' template-tier drift-gate runs fail against it.
        run: |
          python - <<'PY'
          from pathlib import Path
          from baseline.manifest import load_manifest

          m = load_manifest(Path("baseline-manifest.json"))
          print(f"template baseline manifest: version={m.version}, files={len(m.files)}")
          missing = [f.source for f in m.files if not Path(f.source).is_file()]
          if missing:
              print("ERROR: template manifest entries reference sources missing on disk:")
              for s in missing:
                  print(f"  - {s}")
              raise SystemExit(1)
          print("all template-tier sources resolve on disk")
          PY
