name: Self CI

# Self-validation for NWarila/terraform-runner-template. Catches errors in
# the template before they ship to consumer runner repos — typo'd workflow
# YAML, broken contract validator, lint regressions, etc.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
          reporter: github-check

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run shellcheck
        run: shellcheck tools/install_ci_tools.sh

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: python -m pip install --no-cache-dir yamllint==1.35.1
      - name: Run yamllint
        run: |
          yamllint -d "{
            extends: relaxed,
            rules: {
              line-length: disable,
              document-start: disable,
              comments: disable,
              truthy: {check-keys: false}
            }
          }" .github/workflows/ contract/ sync/

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --no-cache-dir ruff==0.13.0
      - name: Run ruff check
        run: ruff check tools/

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6b51ade7a9e4a75a7ad929842dd298a3804ebe8b # v23.1.0
        with:
          globs: "**/*.md"

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        # renovate: datasource=pypi depName=zizmor
        run: python -m pip install --no-cache-dir zizmor==1.24.1
      - name: Run zizmor
        run: zizmor --persona regular .github/workflows/

  audit-tools-smoke-test:
    name: audit tools smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --no-cache-dir pyyaml==6.0.3
      - name: check_template_contract.py imports
        run: python tools/check_template_contract.py --help
      - name: check_caller_workflows.py imports
        run: python tools/check_caller_workflows.py --help
      - name: seed_consumer.py imports
        run: python tools/seed_consumer.py --help
      - name: Contract YAML is well-formed (runner-only)
        run: |
          python -c "
          import yaml
          with open('contract/runner-template-contract.yaml') as fh:
              spec = yaml.safe_load(fh)
          assert spec['version'] == '2', f'unexpected contract version: {spec.get(\"version\")}'
          assert 'universal' in spec, 'missing universal block'
          assert 'types' in spec, 'missing types block'
          assert 'runner' in spec['types'], 'missing types.runner'
          assert 'framework' not in spec['types'], 'this template enforces only runner; framework type should not be present'
          assert 'workflow_pinning' in spec, 'missing workflow_pinning'
          print('runner-template contract manifest looks well-formed')
          "
      - name: Sync manifest is well-formed
        run: |
          python -c "
          import yaml
          with open('sync/synced-files.yaml') as fh:
              spec = yaml.safe_load(fh)
          assert spec['version'] == '2', f'unexpected sync version: {spec.get(\"version\")}'
          assert 'synced_files' in spec, 'missing synced_files'
          for entry in spec['synced_files']:
              assert ('path' in entry) or ('source' in entry and 'target' in entry), \
                  f'malformed entry: {entry!r}'
          print('sync manifest looks well-formed')
          "
      - name: Canonical baseline manifest is well-formed
        run: |
          python -c "
          import yaml
          with open('sync/canonical-baseline.yaml') as fh:
              spec = yaml.safe_load(fh)
          assert spec['version'] == '1', f'unexpected canonical-baseline version: {spec.get(\"version\")}'
          assert 'baseline_files' in spec, 'missing baseline_files'
          for entry in spec['baseline_files']:
              assert ('path' in entry) or ('source' in entry and 'target' in entry), \
                  f'malformed entry: {entry!r}'
          print('canonical-baseline manifest looks well-formed')
          "
