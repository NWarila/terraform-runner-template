name: Drift Gate

# Verifies that this repo's mirrored copies of the org-baseline files
# (community-health policy docs, org ADRs, and layout skeleton
# .gitkeeps) are byte-identical to NWarila/.github at a
# SHA-pinned revision. Fails the PR when they drift, with per-file
# annotations on the offending files in the "Files changed" view.
#
# This template repo is itself a consumer of the org baseline and must
# pass the same gate as every other consumer. When repos are created
# from this template (via GitHub's template-repository feature), they
# inherit this workflow and immediately benefit from the gate. Each
# Terraform-consumer derived from this template adds a SECOND drift-gate
# invocation pinned at this template repo to enforce only the stable
# byte-identical runner scaffold declared in baseline-manifest.json.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: drift-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  org-baseline:
    name: org-baseline / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (org baseline)
        # renovate: datasource=git-refs depName=NWarila/drift-gate
        uses: NWarila/drift-gate@a29b46ba971b55956994d51684c44d6861f7b4bf # main @ 2026-05-11
        with:
          source-repo: NWarila/.github
          # renovate: depName=NWarila/.github packageName=NWarila/.github currentValue=main
          source-ref: e8bc517828a9915a401096305124dff316b76644
          manifest: baseline-manifest.json
          check-name: org-baseline / verify
