name: Drift Gate

# Verifies that this repo's mirrored copies of the org-baseline files
# (community-health policy docs, org ADRs, and layout skeleton
# .gitkeeps) are byte-identical to nwarila-platform/.github at a
# SHA-pinned revision. Fails the PR when they drift, with per-file
# annotations on the offending files in the "Files changed" view.
#
# This template repo is itself a consumer of the org baseline and must
# pass the same gate as every other consumer. When repos are created
# from this template (via GitHub's template-repository feature), they
# inherit this workflow and immediately benefit from the gate. Each
# Terraform-consumer derived from this template will, when ready, add a
# SECOND drift-gate invocation pinned at this template repo to enforce
# this template's standardized runner scaffold: tooling, policies,
# reusable/caller workflows, layout sentinels, and template-tier ADRs
# (see baseline-manifest.json in this repo).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: drift-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  org-baseline:
    name: org-baseline / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drift gate (org baseline)
        # renovate: datasource=github-tags depName=NWarila/drift-gate
        uses: NWarila/drift-gate@d835ae411f1e55e25b2b6c079d5891e7345a043c # main @ 2026-05-09
        with:
          source-repo: nwarila-platform/.github
          source-ref: f2ff593bb4b16555ce0968137f53cdf29b373336 # main @ 2026-05-09
          manifest: baseline-manifest.json
          check-name: org-baseline / verify
