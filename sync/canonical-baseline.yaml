# Files synced from the canonical template (NWarila/terraform-template-template)
# into this per-type template by .github/workflows/canonical-baseline-sync.yaml.
#
# Anything listed here is treated as authoritative on the canonical side: local
# changes are reverted on the next sync PR. To customize one of these files for
# this template specifically, REMOVE its entry here first; otherwise the sync
# will clobber the customization.
#
# Files that legitimately differ per template (the runner contract, runner
# reusable-pr-validation specifics, runner README/seed scaffold) are NOT listed
# here; they're owned by this template alone.
#
# Schema: same as consumer-side sync/synced-files.yaml.
#   - path:   shorthand when source path == target path.
#   - source: path within canonical
#   - target: path within this template
#
# Source repo + ref are pinned in the canonical-baseline-sync workflow's env
# (CANONICAL_REPO, CANONICAL_REF). Renovate keeps the SHA current.

version: "1"

baseline_files:
  # ----- Universal reusable workflows -----
  # Same callers all per-type templates expose; their content is the source of
  # truth for the fleet's quality gates.
  - path: .github/workflows/reusable-codeql.yaml
  - path: .github/workflows/reusable-scorecard.yaml
  - path: .github/workflows/reusable-iac-security.yaml
  - path: .github/workflows/reusable-auto-merge.yaml
  - path: .github/workflows/reusable-org-adr-sync.yaml
  - path: .github/workflows/reusable-release-please.yaml
  - path: .github/workflows/reusable-release-evidence.yaml
  - path: .github/workflows/reusable-template-sync.yaml

  # ----- Terraform-shared reusable -----
  # Owned by both terraform-template-template (framework consumers) and this
  # template (runner consumers). Same file in both; sync keeps it identical.
  - path: .github/workflows/reusable-terraform-validation.yaml

  # ----- Toolchain configs -----
  - path: .editorconfig
  - path: .gitattributes
  - path: .markdownlint-cli2.jsonc
  - path: .pre-commit-config.yaml
  - path: .terraform-docs.yml
  - path: .tflint.hcl
  - path: Makefile

  # ----- Universal tools -----
  - path: tools/check_docs_layout.py
  - path: tools/install_ci_tools.sh

  # ----- Renovate baseline -----
  - path: .github/renovate.json5

# NOT synced from canonical (intentionally):
#   - contract/*.yaml — this template owns its type-specific contract.
#   - tools/check_template_contract.py — generic logic; could be synced, but
#     left per-template for now to allow each template to evolve its own
#     validator if the type's needs diverge. Keep an eye on drift.
#   - tools/seed_consumer.py — same reasoning.
#   - tools/check_caller_workflows.py — same reasoning.
#   - sync/synced-files.yaml — what THIS template syncs into ITS consumers
#     differs per type; not synced from canonical.
#   - README.md, LICENSE, CHANGELOG.md, release-please-config.json — per-template.
