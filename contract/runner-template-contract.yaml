# Runner Template Contract
#
# Machine-readable manifest for terraform-runner repos consuming
# NWarila/terraform-runner-template, plus the template repo's own
# self-validation shape (`template`). The universal section is local to
# this contract and applies to both supported shapes.
#
# Rule philosophy:
#   - Every required path maps to a load-bearing operational concern.
#   - Every regex check enforces an invariant that, if violated, would
#     degrade reproducibility, security, or release integrity.
#   - Exceptions require an ADR or a documented rationale on the
#     consuming PR.

version: '2'
universal:
  required_root_files:
  - path: README.md
    rationale: Entry point; must describe usage and quality controls.
  - path: LICENSE
    rationale: Repository license is non-optional.
  - path: CODE_OF_CONDUCT.md
    rationale: Local mirror of the org-owned code of conduct; drift-gated against NWarila/.github.
  - path: CONTRIBUTING.md
    rationale: Local mirror of the org-owned contribution guide; drift-gated against NWarila/.github.
  - path: SECURITY.md
    rationale: Local mirror of the org-owned security policy; drift-gated against NWarila/.github.
  - path: SUPPORT.md
    rationale: Local mirror of the org-owned support policy; drift-gated against NWarila/.github.
  - path: .editorconfig
    rationale: Baseline editor consistency.
  - path: .gitignore
    rationale: Excludes local state, credentials, caches, and build artifacts.
  - path: .gitattributes
    rationale: Repository text handling.
  - path: .pre-commit-config.yaml
    rationale: Pre-commit hooks for local validation.
  - path: .markdownlint-cli2.jsonc
    rationale: Markdown lint configuration.
  required_github_files:
  - path: .github/CODEOWNERS
    rationale: Ownership for high-risk paths.
  - path: .github/PULL_REQUEST_TEMPLATE.md
    rationale: Risk evidence and validation checklist.
  - path: .github/renovate.json5
    rationale: Dependency update policy aligned with org baseline.
  - path: .github/workflows/pr-validation.yaml
    applies_to: [runner]
    rationale: Calls the reusable Terraform validation workflow.
  - path: .github/workflows/drift-gate.yaml
    rationale: 'Calls NWarila/drift-gate as a SHA-pinned composite action. Verifies the
      consumer mirrors the org-baseline files (and the type-template baseline files,
      when applicable) byte-identically against canonical. Replaces the previous
      org-adr-sync + template-sync mechanism with a single composable check.'
  - path: .github/workflows/security.yaml
    applies_to: [runner]
    rationale: Calls the combined reusable security surface (IaC, CodeQL, Scorecard).
  required_documentation:
  - path: docs/README.md
  - path: docs/explanation/architecture.md
  - path: docs/explanation/testing-strategy.md
  - path: docs/explanation/threat-model.md
  - path: docs/reference/release-gates.md
  - path: docs/reference/invariants.md
  - path: docs/reference/mirroring.md
  - path: docs/how-to/develop-this-module.md
  - path: docs/decision-records/
    type: directory
types:
  runner:
    rationale: "Data-only deployer. Owns repo inventory under terraform/{public,private}\nand consumes a pinned framework at runtime. Its local tree intentionally\nstays thin: no template-maintainer tools, local contract harness, OPA policy\nsuite, or integration fixture is required in runner repos. PR validation\nmust check out the framework at framework_ref, overlay the runner's inventory\ninto the framework's terraform/repos/ runtime path, and run the framework\nquality gate against the assembled tree - true end-to-end coverage.\n"
    required_paths:
    - path: terraform/public/
      rationale: 'Public repo definitions overlaid onto the framework at deploy time.

        Directory must exist even if currently empty (use a .gitkeep).

        '
      type: directory
    - path: terraform/private/
      rationale: 'Private repo definitions. May be sourced from S3 at deploy time;

        directory must still exist at the runner inventory path.

        '
      type: directory
    - path: .github/workflows/terraform-deploy.yaml
      rationale: 'Calls the framework''s reusable-terraform-deploy.yaml. This is the

        actual `terraform apply` workflow; pr-validation is plan-only.

        '
    - path: tests/fixtures/terraform/private/
      rationale: 'Public-safe private inventory fixtures used by pr-validation when the production

        private repos are sourced from S3 (which CI can''t reach without

        AWS credentials). Required so PR validation has deterministic

        input on every run.

        '
      type: directory
    content_rules:
    - file: .github/workflows/terraform-deploy.yaml
      pattern: '(?:NWarila|nwarila-platform)/[A-Za-z0-9_.-]+/.github/workflows/reusable-terraform-deploy.yaml@[0-9a-f]{40}'
      must_match: true
      rationale: Deploy callers must delegate to an approved SHA-pinned framework reusable deploy workflow.
    - file: .github/workflows/terraform-deploy.yaml
      pattern: AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY
      must_match: false
      rationale: Static AWS access keys are forbidden; OIDC is the only credential path.
    - file: .github/workflows/security.yaml
      pattern: 'NWarila/terraform-runner-template/.github/workflows/reusable-iac-security.yaml@[0-9a-f]{40}'
      must_match: true
      rationale: Runner security callers must consume the template-owned IaC reusable by immutable SHA.
    - file: .github/workflows/security.yaml
      pattern: 'NWarila/terraform-runner-template/.github/workflows/reusable-codeql.yaml@[0-9a-f]{40}'
      must_match: true
      rationale: Runner security callers must consume the template-owned CodeQL reusable by immutable SHA.
    - file: .github/workflows/security.yaml
      pattern: 'NWarila/terraform-runner-template/.github/workflows/reusable-scorecard.yaml@[0-9a-f]{40}'
      must_match: true
      rationale: Runner security callers must consume the template-owned Scorecard reusable by immutable SHA.
    - file: .github/workflows/security.yaml
      pattern: '\./\.github/workflows/reusable-(iac-security|codeql|scorecard)\.yaml'
      must_match: false
      rationale: Runner repos must not hide security implementation in local reusable workflow copies.
    forbidden_paths:
    - path: tools/
      rationale: Runner repos are data-only deployers; template-maintainer tooling belongs in terraform-runner-template.
    - path: policies/
      rationale: Runner repos do not own local OPA policy suites; validation policy belongs in the template/framework layer.
    - path: Makefile
      rationale: Runner repos delegate validation and apply through reusable workflows instead of local make targets.
    - glob: .github/workflows/reusable-*.yaml
      allow:
      - .github/workflows/reusable-auto-merge.yaml
      rationale: 'Local reusable workflow implementations are template-owned, except
        the privileged auto-merge reusable, which stays local so the
        pull_request_target static analyzer can inspect the complete call graph.'
  template:
    rationale: 'Self-validation shape for this type-template repository. It owns
      reusable workflows, contract tooling, drift-gate metadata, and the seed
      runner scaffold that downstream runner consumers inherit.'
    required_paths:
    - path: baseline-manifest.json
      rationale: Template-tier drift-gate manifest consumed by downstream runners.
    - path: Makefile
      rationale: Template-local wrapper around `python tools/verify.py`.
    - path: release-please-config.json
      rationale: Optional release automation configuration inherited by consumers that publish releases.
    - path: .release-please-manifest.json
      rationale: Optional release-please version manifest.
    - path: contract/runner-template-contract.yaml
      rationale: Machine-readable runner/template contract manifest.
    - path: .github/workflows/ci.yaml
      rationale: Self-validation workflow for this template repository.
    - path: .github/workflows/release.yaml
      rationale: Optional release and evidence caller.
    - path: .github/workflows/auto-merge.yaml
      rationale: Isolated pull_request_target caller for trusted-bot auto-merge.
    - path: .github/workflows/reusable-terraform-validation.yaml
      rationale: Runner-mode reusable validation workflow consumed by runner repos.
    - path: .github/workflows/reusable-codeql.yaml
      rationale: Reusable CodeQL workflow consumed by runner repos.
    - path: .github/workflows/reusable-iac-security.yaml
      rationale: Reusable IaC security workflow consumed by runner repos.
    - path: .github/workflows/reusable-scorecard.yaml
      rationale: Reusable OpenSSF Scorecard workflow consumed by runner repos.
    - path: .github/workflows/reusable-release-please.yaml
      rationale: Reusable release-please workflow consumed by runner repos.
    - path: .github/workflows/reusable-release-evidence.yaml
      rationale: Reusable release evidence workflow consumed by runner repos.
    - path: .github/workflows/reusable-auto-merge.yaml
      rationale: Reusable trusted-bot auto-merge workflow consumed by runner repos.
    - path: .github/workflows/security.yaml
      rationale: Canonical IaC security caller inherited by runner repos.
    - path: .github/workflows/terraform-deploy.yaml
      rationale: Reference deploy caller proving the runner/framework wiring.
    - path: tools/check_template_contract.py
      rationale: Contract validator used by consumers and self-CI.
    - path: tools/check_caller_workflows.py
      rationale: Caller-workflow validator used by reusable validation.
    - path: tools/run_contract_tests.py
      rationale: Self-CI harness that runs validator fixtures and asserts pass/fail behavior.
    - path: tools/build_opa_input.py
      rationale: Builds real-repo OPA input for `make opa-policy`.
    - path: tools/ci/config.toml
      rationale: Normalized CI harness config shared across Terraform repo types.
    - path: tools/ci/run_integration.py
      rationale: Builds and verifies the ephemeral integration workspace used by `make integration`.
    - path: tools/install_ci_tools.sh
      rationale: Pinned CI tool installer used by reusable validation.
    - path: tools/verify.py
      rationale: Cross-platform local verification entrypoint.
    - path: policies/opa/repo_hygiene.rego
      rationale: OPA policy enforcing workflow pinning for this template.
    - path: policies/opa/repo_hygiene_test.rego
      rationale: Unit tests for the OPA policy's pass/fail behavior.
    - path: policies/opa/terraform_plan.rego
      rationale: Plan-aware OPA policy for Terraform resource invariants.
    - path: policies/opa/terraform_plan_test.rego
      rationale: Unit tests for plan-aware OPA policy.
    - path: tools/build_plan_input.py
      rationale: Normalizes `terraform show -json` plan output for plan-aware OPA checks.
    - path: terraform/public/
      rationale: Seed public runner data directory inherited by consumers.
      type: directory
    - path: terraform/private/
      rationale: Seed private runner data directory inherited by consumers.
      type: directory
    - path: tests/fixtures/
      rationale: Seed public-safe fixture directory inherited by consumers.
      type: directory
    - path: fixtures/integration/basic/
      rationale: Seed runner integration fixture proving framework composition.
      type: directory
workflow_pinning:
  enforce_sha_pin: true
  allow_local_refs: true
  allow_docker_digest: true
  rationale: 'GitHub Actions are mutable: a tag like @v4 can be repointed by a

    compromised maintainer. SHA pinning ensures the action that ran yesterday

    is the action that runs today. Renovate keeps pins current.

    '
