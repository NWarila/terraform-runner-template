name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cccccccccccccccccccccccccccccccccccccccc
        with:
          role-to-assume: arn:aws:iam::123456789012:role/example-terraform-deploy
          aws-region: us-east-1

  deploy:
    needs: auth
    uses: NWarila/terraform-framework-template/.github/workflows/reusable-terraform-deploy.yaml@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    with:
      framework_ref: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      overlay_paths: |
        repos/public => terraform/repos/public
        repos/private => terraform/repos/private
      tfvars_file: repos/public/sample-environments.tfvars
      apply: false
