name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: NWarila/terraform-framework-template/.github/workflows/reusable-terraform-deploy.yaml@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    with:
      framework_ref: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      overlay_paths: |
        terraform/public => terraform/repos/public
        terraform/private => terraform/repos/private
      tfvars_file: terraform/public/sample-environments.tfvars
      apply: false
