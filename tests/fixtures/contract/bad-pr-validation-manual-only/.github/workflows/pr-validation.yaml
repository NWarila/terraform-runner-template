name: PR Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: NWarila/terraform-runner-template/.github/workflows/reusable-terraform-validation.yaml@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    with:
      terraform_version: "1.15.1"
      template_ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      mode: runner
      run_contract_check: true
      lint_advisory: false
      framework_repo: NWarila/terraform-framework-template
      framework_ref: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      overlay_paths: |
        terraform/public => terraform/repos/public
        terraform/private => terraform/repos/private
