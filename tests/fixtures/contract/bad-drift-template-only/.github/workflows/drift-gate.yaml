name: Drift Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  runner-template:
    runs-on: ubuntu-latest
    steps:
      - name: Drift gate (runner template baseline)
        uses: NWarila/drift-gate@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          source-repo: NWarila/terraform-runner-template
          source-ref: cccccccccccccccccccccccccccccccccccccccc
          manifest: baseline-manifest.json
          check-name: runner-template / verify
