name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: NWarila/mock-framework-template/.github/workflows/reusable-terraform-deploy.yaml@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    with:
      framework_ref: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      overlay_paths: |
        repos/public => terraform/repos/public
        repos/private => terraform/repos/private
      tfvars_file: repos/public/sample-environments.tfvars
      apply: false
